# k8s/secret.example.yaml
# EXAMPLE ONLY — the real Secret is generated by scripts/create-secret.sh
# from Terraform outputs and is NEVER committed to Git.
#
# Manual creation (if not using the script):
#   kubectl create secret generic app-secrets -n devops-app \
#     --from-literal=DB_HOST=<rds-address> \
#     --from-literal=DB_PASSWORD=<password> \
#     --from-literal=SNS_TOPIC_ARN=<arn> \
#     --from-literal=SES_SENDER=<verified-email>
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
stringData:
  DB_HOST: your-rds-endpoint.rds.amazonaws.com
  DB_PASSWORD: CHANGE_ME
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:YOUR_ACCOUNT_ID:vm-order-prod-sns
  SES_SENDER: your-verified@email.com
