# docker/frontend/nginx.conf
# Phase 2 had:  proxy_pass http://{{ backend_private_ip }}:5000/;  (Ansible-templated IP)
# Phase 3 has:  proxy_pass http://backend:5000/;
# "backend" is the Kubernetes SERVICE name — cluster DNS resolves it to the
# Service, which round-robins across all healthy backend pods. No IPs, no
# templating, no Ansible.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Lightweight endpoint for Kubernetes readiness/liveness probes
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Proxy API calls to the backend Service
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
