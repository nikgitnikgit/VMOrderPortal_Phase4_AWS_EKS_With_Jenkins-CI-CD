# docker/frontend/nginx.conf
# Phase 2 had:  proxy_pass http://{{ backend_private_ip }}:5000/;  (Ansible-templated IP)
# Phase 3 has:  proxy_pass http://backend:5000/;
# "backend" is the Kubernetes SERVICE name — cluster DNS resolves it to the
# Service, which round-robins across all healthy backend pods. No IPs, no
# templating, no Ansible.
#
# This file is copied to /etc/nginx/conf.d/default.conf, which the base image
# includes from INSIDE its http{} block. Directives above the server{} block
# are therefore in http context, which is where limit_req_zone must live.

# --- REVIEW FIX 2.4: identify the real client -------------------------------
# Rate limiting keyed on $binary_remote_addr is worse than useless behind an
# ALB: with target-type=ip every request arrives from one of a handful of load
# balancer ENIs, so the whole internet shares a single bucket. One noisy
# visitor would throttle everybody, and an attacker would be unaffected.
#
# The ALB APPENDS the true client address to X-Forwarded-For. A client can
# forge the header, but forged values land EARLIER in the list, and with
# real_ip_recursive off nginx takes the LAST address — the one the ALB wrote.
# So the key is both correct and unspoofable.
#
# Trusting 10.0.0.0/8 is safe here: the frontend NetworkPolicy only admits
# traffic from the ALB, so nothing else can present an X-Forwarded-For at all.
set_real_ip_from 10.0.0.0/8;
real_ip_header   X-Forwarded-For;
real_ip_recursive off;

# --- REVIEW FIX 2.4: rate limiting ------------------------------------------
# Two zones, because the two endpoints have very different cost and cadence.
#
#   submit  /api/submit-order — writes RDS, uploads to S3, calls the worker,
#           which publishes SNS and sends SES mail. Unauthenticated, so this
#           is an amplification path straight to the AWS bill. A human orders
#           a VM a handful of times a day; 10/min with a burst of 5 is far
#           above real use and far below abuse.
#
#   api     everything else — /api/check-name fires as the user types (the
#           page debounces), so this has to be generous or the form breaks.
#
# 10m of shared memory tracks roughly 160k addresses. 429 rather than the
# nginx default of 503, because the client IS being rate limited and a proxy
# returning 503 reads as "backend down".
limit_req_zone $binary_remote_addr zone=submit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    # REVIEW FIX 2.4 — an order is a few hundred bytes of JSON. nginx defaults
    # to 1m, which lets an unauthenticated caller push a megabyte per request
    # into Flask's parser. Rejected at the edge with 413, before the backend
    # allocates anything.
    client_max_body_size 16k;

    # Cheap hardening, no behaviour change: do not advertise the exact nginx
    # version to anyone fingerprinting for known CVEs.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Declared once at server level and inherited by every proxying location
    # below, so the two /api rules cannot drift apart.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;

    location / {
        try_files $uri $uri/ =404;
    }

    # Lightweight endpoint for Kubernetes readiness/liveness probes.
    # Deliberately NOT rate limited: the kubelet probes every few seconds from
    # the node, and throttling it would restart healthy pods.
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # The expensive endpoint. Exact match, so it is evaluated before the /api/
    # prefix below and gets the strict zone.
    location = /api/submit-order {
        limit_req zone=submit burst=5 nodelay;
        proxy_pass http://backend:5000/submit-order;
    }

    # Everything else on the API: health, check-name.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:5000/;
    }
}
