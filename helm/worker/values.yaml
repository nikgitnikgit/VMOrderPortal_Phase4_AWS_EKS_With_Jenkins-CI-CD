# helm/worker/values.yaml
image:
  registry: ""                  # (deploy.sh)
  repository: vm-order-worker
  tag: "1.0.0"

replicas: 2                     # OUR DESIGN DECISION: 2 for availability —
                                # push-driven service, no duplicate-email risk,
                                # survives node failure with zero downtime

serviceAccount:
  name: worker-sa
  roleArn: ""                   # (deploy.sh) IRSA: SNS Publish + SES only

service:
  port: 5001

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi

hpa:
  enabled: false                # DOCUMENTED DECISION: email volume is tiny;
                                # autoscaling here would be decoration.
  # Values below are inactive while enabled=false, but defined so that
  # flipping the switch later produces a valid HPA immediately:
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70

config:
  AWS_REGION: us-east-1         # (deploy.sh)
  DB_USER: vmadmin
  DB_NAME: vmorders
  PYTHONDONTWRITEBYTECODE: "1"

# REVIEW FIX 2.2 — was the shared "app-secrets". One Secret per workload.
# The worker legitimately needs all four keys: it publishes to SNS, sends the
# SES confirmation, AND updates sns_sent/ses_sent on the order row in RDS.
existingSecret: worker-secrets   # created by scripts/install-jenkins.sh, NOT by Helm

networkPolicy:
  enabled: true
  vpcCidr: 10.23.0.0/16
  # REVIEW FIX 4.6 — 5432 egress is allowed only to the DB subnets, not the
  # whole VPC. Overridden per environment by Jenkinsfile-cd from
  # `terraform output db_subnet_cidrs`; these are the defaults.
  dbSubnetCidrs:
    - 10.23.2.0/24
    - 10.23.3.0/24
