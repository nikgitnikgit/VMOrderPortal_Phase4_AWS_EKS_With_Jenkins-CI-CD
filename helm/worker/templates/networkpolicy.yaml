{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  labels:
    app: worker
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # ONLY backend pods may call the worker, only on its port
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5001
  egress:
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # RDS PostgreSQL (worker reads order details)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - port: 5432
    # AWS APIs (SNS, SES) over HTTPS
    - to: []
      ports:
        - port: 443
{{- end }}
