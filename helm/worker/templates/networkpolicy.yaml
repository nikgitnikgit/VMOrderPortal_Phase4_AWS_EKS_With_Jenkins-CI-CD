{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  labels:
    app: worker
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # ONLY backend pods may call the worker, only on its port
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5001
  egress:
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # RDS PostgreSQL — REVIEW FIX 4.6.
    # Was the whole VPC /16 (~65k addresses), which includes the public
    # subnets, the node subnets and every other pod. Narrowed to the two
    # database subnets, where RDS actually lives.
    - to:
{{- range .Values.networkPolicy.dbSubnetCidrs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - port: 5432
    # AWS APIs (SNS, SES) over HTTPS
    - to: []
      ports:
        - port: 443
{{- end }}
