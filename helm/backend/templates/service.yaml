apiVersion: v1
kind: Service
metadata:
  # The Service NAME is the DNS name other pods use: http://backend:5000
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP   # internal only — never exposed to the internet
  selector:
    app: backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
