# helm/backend/values.yaml — the control panel of the backend service.
# Values marked (deploy.sh) are injected from Terraform outputs at install.

image:
  registry: ""                  # (deploy.sh) e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com
  repository: vm-order-backend
  tag: "1.0.0"                  # pinned — never latest

replicas: 2                     # baseline; HPA takes over from here

serviceAccount:
  name: backend-sa
  roleArn: ""                   # (deploy.sh) IRSA role ARN — keyless AWS access

service:
  port: 5000

resources:
  requests:                     # baseline for HPA percentage math
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70                 # % of requested CPU

config:                         # non-secret config → ConfigMap
  AWS_REGION: us-east-1         # (deploy.sh)
  DB_PORT: "5432"
  DB_USER: vmadmin
  DB_NAME: vmorders
  S3_BUCKET: ""                 # (deploy.sh)
  WORKER_URL: http://worker:5001   # K8s Service DNS — no IPs! (code appends /notify itself)
  PYTHONDONTWRITEBYTECODE: "1"  # nothing tries to write into the read-only image

# REVIEW FIX 2.2 — was the shared "app-secrets". One Secret per workload:
# DB_HOST + DB_PASSWORD only — the backend never calls SNS or SES.
existingSecret: backend-secrets   # created by scripts/install-jenkins.sh, NOT by Helm

networkPolicy:
  enabled: true
  vpcCidr: 10.23.0.0/16         # RDS lives inside the VPC
  # REVIEW FIX 4.6 — 5432 egress is allowed only to the DB subnets, not the
  # whole VPC. Overridden per environment by Jenkinsfile-cd from
  # `terraform output db_subnet_cidrs`; these are the defaults.
  dbSubnetCidrs:
    - 10.23.2.0/24
    - 10.23.3.0/24
