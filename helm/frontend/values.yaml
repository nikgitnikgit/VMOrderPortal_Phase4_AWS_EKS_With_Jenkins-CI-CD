# helm/frontend/values.yaml
image:
  registry: ""                  # (deploy.sh)
  repository: vm-order-frontend
  tag: "1.0.0"

replicas: 2

serviceAccount:
  name: frontend-sa
  roleArn: ""                   # stays EMPTY on purpose: nginx needs ZERO
                                # AWS access — least privilege includes
                                # granting nothing when nothing is needed

service:
  port: 8080                    # non-root nginx cannot bind below 1024

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70

ingress:
  enabled: true
  # AWS Load Balancer Controller reads these annotations and creates a real ALB
  scheme: internet-facing
  healthcheckPath: /healthz

  # REVIEW FIX 4.4 — set this to enable HTTPS (443 + redirect from 80).
  # Empty by default so a fresh clone deploys without a certificate.
  # Get an ARN with:  ./scripts/create-cert.sh
  # Then pass it at deploy time:
  #   helm upgrade ... --set ingress.certificateArn=arn:aws:acm:...
  # Jenkins already does exactly this; the app was the one still on plain HTTP.
  certificateArn: ""
  # ELBSecurityPolicy-2016-08 (the ALB default) still allows TLS 1.0 and 1.1.
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

existingSecret: ""              # frontend needs NO secrets at all

networkPolicy:
  enabled: true
  vpcCidr: 10.23.0.0/16         # ALB traffic arrives from inside the VPC
