{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # ALB targets pod IPs directly; its traffic originates inside the VPC.
    # Tightest practical rule: allow VPC sources on the nginx port only.
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - port: 8080
  egress:
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The ONLY app egress: proxy to backend
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5000
{{- end }}
