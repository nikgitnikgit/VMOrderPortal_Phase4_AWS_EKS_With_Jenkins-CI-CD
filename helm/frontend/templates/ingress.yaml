{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    # Read by the AWS Load Balancer Controller → creates an internet-facing ALB
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    # target-type ip = ALB sends traffic straight to pod IPs (modern VPC CNI mode)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath }}
    # HTTP only — documented trade-off: HTTPS needs a domain + certificate
    alb.ingress.kubernetes.io/listen-ports: "[{\"HTTP\": 80}]"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.service.port }}
{{- end }}
