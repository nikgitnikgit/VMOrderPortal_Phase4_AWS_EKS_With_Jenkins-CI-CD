apiVersion: v1
kind: ServiceAccount
# automountServiceAccountToken: our pods never call the Kubernetes API,
# so they should not even carry an API token — least privilege.
# (IRSA uses its own separate token mechanism and is unaffected.)
automountServiceAccountToken: false
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app: frontend
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # This single line IS the IRSA magic: pods using this ServiceAccount
    # receive temporary AWS credentials for this role — no access keys.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
  {{- end }}
