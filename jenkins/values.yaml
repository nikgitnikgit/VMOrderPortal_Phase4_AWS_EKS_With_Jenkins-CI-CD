# jenkins/values.yaml — Jenkins Configuration as Code (static part)
#
# Everything Jenkins needs to come up fully configured: plugins, system
# settings, security context, storage. Nothing is ever clicked in the UI —
# destroy the cluster, rebuild it, and Jenkins returns identically.
#
# Environment-specific values (account ID, cluster name, your IP, certificate
# ARN, repo URL) are NOT here. They are generated at install time by
# scripts/configure-jenkins.sh from Terraform outputs, so this file is safe to
# commit and a second contributor needs no edits.
#
# IMPORTANT LESSON ENCODED HERE:
# The chart generates its OWN JCasC config from controller.* values. If a
# custom configScript sets a key the chart already sets, JCasC merges both,
# finds a conflict, and refuses to start with ConfiguratorConflictException.
# So: prefer the chart's native values; use configScripts only for what the
# chart does not model.

controller:
  # --- Pinned image, never :latest (spec requirement) -------------------
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.568.1-lts-jdk21"
    pullPolicy: IfNotPresent

  # --- Plugins ----------------------------------------------------------
  # Deliberately NOT version-pinned. The plugin installer resolves each
  # plugin's DEPENDENCIES to their latest versions, and those require a recent
  # core. Pinning plugins against an older core produces a crash-looping init
  # container full of "requires a greater version of Jenkins" errors. The
  # version that actually controls the outcome is the CHART version, pinned in
  # jenkins/CHART_VERSION, because it determines the core image above.
  installPlugins:
    - kubernetes              # dynamic pod agents
    - workflow-aggregator     # declarative pipeline
    - git                     # clone the repository
    - github                  # webhook trigger
    - github-branch-source    # multibranch + PR discovery
    - configuration-as-code   # JCasC itself
    - job-dsl                 # required for the `jobs:` root element
    - pipeline-stage-view     # stage view in the UI
    - junit                   # publish test results
    - mailer                  # email notifications (bonus)
    - email-ext               # emailext step used by both pipelines
    - pipeline-utility-steps  # readJSON in the CI pipeline

  # --- All builds run on agents; the controller only coordinates ---------
  numExecutors: 0

  # --- Resources --------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  # --- Probes (spec bonus) ---------------------------------------------
  probes:
    startupProbe:
      httpGet:
        path: '/login'
        port: http
      periodSeconds: 10
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: '/login'
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: '/login'
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  # --- Security context --------------------------------------------------
  # Jenkins needs a writable JENKINS_HOME, so the root filesystem cannot be
  # read-only; everything else is locked down.
  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  # --- Exposure ---------------------------------------------------------
  # HTTPS and the IP restriction are added at install time by
  # configure-jenkins.sh: the certificate ARN and your public IP are both
  # environment-specific and must not be committed.
  serviceType: ClusterIP
  ingress:
    enabled: true
    ingressClassName: alb
    path: /
    # MUST be Prefix. The default (ImplementationSpecific) lets the ALB
    # controller decide, and it treats "/" as an EXACT match — so the root URL
    # works but /login, /job/... and every static asset return a bare 404 from
    # the ALB before ever reaching Jenkins.
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /login
      # Overwritten at install time. If these placeholders ever reach a
      # running cluster, verify-jenkins.sh fails.
      alb.ingress.kubernetes.io/inbound-cidrs: "REPLACE_AT_INSTALL"

  # --- Scheduling: the tainted Jenkins node only ------------------------
  tolerations:
    - key: "role"
      operator: "Equal"
      value: "jenkins"
      effect: "NoSchedule"
  # nodeSelector injected at install time (the node group name contains the
  # cluster name). The label EKS actually sets is `eks.amazonaws.com/nodegroup`
  # — there is no `-name` suffix.

  # --- JCasC: only what the chart does NOT already model -----------------
  # NOT set here, because the chart owns them and duplicating causes
  # ConfiguratorConflictException:
  #   jenkins.numExecutors          -> controller.numExecutors (above)
  #   jenkins.securityRealm         -> chart default (local, signup disabled)
  #   jenkins.authorizationStrategy -> chart default
  #   jenkins.clouds (kubernetes)   -> chart builds this from agent.* values
  JCasC:
    defaultConfig: true
    configScripts:
      welcome: |
        jenkins:
          systemMessage: >
            VM Order Portal — Phase 4 CI/CD.
            Configured entirely by JCasC; no manual UI setup.
            application-ci builds and scans. application-cd deploys.

# --- Persistence: JENKINS_HOME on an EBS volume ---------------------------
persistence:
  enabled: true
  size: 8Gi
  storageClass: gp2

# --- Controller ServiceAccount --------------------------------------------
serviceAccount:
  create: false          # created by jenkins/rbac.yaml, with its RoleBinding
  name: jenkins

# --- Agents ----------------------------------------------------------------
# The chart builds the Kubernetes cloud from this section. Each pipeline
# supplies its own podTemplate (with its own ServiceAccount), so only defaults
# live here.
agent:
  enabled: true
  namespace: "jenkins"
  # Agents must tolerate the Jenkins node taint even when a pipeline forgets.
  tolerations:
    - key: "role"
      operator: "Equal"
      value: "jenkins"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
