# jenkins/secret.example.yaml
#
# EXAMPLE ONLY — contains no real values and is never applied.
# Documents every secret the system uses, where the real value comes from,
# and how to rotate it.
#
# NONE of these values live in Git, in Terraform state, or in the Jenkins
# configuration. See the Security chapter of README.md.

---
# 1. Application database credentials.
#    Real value: created by scripts/install-jenkins.sh, which reads
#    db_password from terraform/terraform.tfvars on YOUR machine.
#    Jenkins has no RBAC permission to read this Secret — it deploys the
#    application without being able to see its credentials.
#
#    Rotate:  change db_password in terraform.tfvars
#             terraform apply          (updates the RDS master password)
#             ./scripts/install-jenkins.sh   (re-creates the Secret)
#             kubectl rollout restart deployment/backend deployment/worker -n devops-app
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
stringData:
  DB_HOST: "<rds-endpoint>.rds.amazonaws.com"
  DB_PASSWORD: "<from terraform.tfvars — never committed>"
  SNS_TOPIC_ARN: "arn:aws:sns:<region>:<account-id>:<topic>"
  SES_SENDER: "<verified-ses-address>"

---
# 2. SES SMTP credentials for Jenkins email notifications (bonus).
#    Real value: generated in the SES console (SMTP settings > Create SMTP
#    credentials). These are IAM credentials in SMTP form.
#
#    Rotate:  create new SMTP credentials in SES, apply this Secret with the
#             new values, restart Jenkins, then DELETE the old IAM user.
#    Revoke:  delete the IAM user in the SES SMTP credential set — mail stops
#             immediately; no other component is affected.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-smtp
  namespace: jenkins
type: Opaque
stringData:
  username: "<SES SMTP username — starts with AKIA>"
  password: "<SES SMTP password>"

# ---------------------------------------------------------------------------
# 3. AWS credentials — DELIBERATELY ABSENT.
#    There is no AWS access key anywhere in this project. Every AWS call is
#    authenticated with IRSA: the pod's ServiceAccount is exchanged for
#    short-lived STS credentials scoped to one IAM role.
#      jenkins-agent-ci -> push to 4 ECR repos, write s3://<bucket>/builds/*
#      jenkins-agent-cd -> read ECR, write s3://<bucket>/deployments/*
#      backend          -> write s3://<bucket>/orders/*
#      worker           -> SNS publish, SES send
#    Rotation is automatic (tokens last ~1h). To revoke, delete or detach the
#    IAM role; access stops within the token lifetime.
#
# 4. GitHub token — used ONLY by scripts/register-webhook.sh, on your machine.
#    Read from $GITHUB_TOKEN or ~/.github_token. Never sent to the cluster,
#    never stored in Jenkins, never committed (~/.github_token is outside the
#    repo and *.token is gitignored).
#    Rotate:  create a new fine-grained token with `Webhooks: read and write`,
#             replace the file, re-run register-webhook.sh.
#    Revoke:  delete the token on GitHub. The existing webhook keeps working;
#             only re-registration needs the token.
# ---------------------------------------------------------------------------
